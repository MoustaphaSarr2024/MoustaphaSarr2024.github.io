<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="vrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="100" height="100" rx="26" fill="#0f172a" />
  <rect width="92" height="92" x="4" y="4" rx="22" fill="none" stroke="url(#vrGrad)" stroke-width="2.5" opacity="0.7"/>
  
  <!-- VR Headset Icon -->
  <g transform="translate(10, 18)">
    <!-- Top Strap -->
    <path d="M 8,28 C 8,12 72,12 72,28" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round" />
    <!-- Visor Shell -->
    <rect x="10" y="24" width="60" height="34" rx="14" fill="url(#vrGrad)" filter="url(#glow)"/>
    <!-- Visor Glass -->
    <rect x="15" y="29" width="50" height="24" rx="10" fill="#090d16" />
    <!-- Visor Reflection -->
    <path d="M 20,33 Q 40,30 60,33" fill="none" stroke="url(#visorGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Center LED Dot -->
    <circle cx="40" cy="45" r="3" fill="#38bdf8" />
  </g>
</svg>
